name: Bug report
description: Something in Scout or the Scout VS Code extension does not work.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste tokens, API keys, passwords, Wi-Fi credentials or private firmware here or in the zip.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - VS Code extension
        - Probe hardware
        - CLI
        - Docs
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Run Scout: Flash Image\n2. ..."
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Filled in by Scout: Report Issue (VS Code, extension, CLI, firmware, OS).
      render: text
  - type: checkboxes
    id: bundle
    attributes:
      label: Report bundle
      description: "Scout: Report Issue builds a local zip. Nothing is sent automatically. Open it, remove anything private, then drag it into this issue. If you cannot attach it, say why in the box above."
      options:
        - label: I attached the zip from "Scout: Report Issue" after reading it, or I explained why I cannot.
        - label: The issue and zip contain no tokens, keys or passwords.
          required: true
